spring.application.name=farmersapi
server.port=${PORT:8085}
server.forward-headers-strategy=framework
logging.level.com.openmarket.farmersapi=${APP_LOG_LEVEL:INFO}
weather.api.key=${WEATHER_API_KEY}
mandi.api.key=${MANDI_API_KEY}

spring.ai.openai.api-key=${GROQ_API_KEY}


# Do not include /v1
spring.ai.openai.base-url=https://api.groq.com/openai

# Correct property for Spring AI 1.0.x
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.db.product-url=${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/PRODUCTMANAGEMENT}
app.db.user-url=${USER_DB_URL:jdbc:mysql://localhost:3306/USER}
app.db.username=${DB_USERNAME}
app.db.password=${DB_PASSWORD}
app.razorpay.key-id=${RAZORPAY_KEY_ID}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.mail.username=${MAIL_USERNAME}
app.mail.password=${MAIL_PASSWORD}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Farm Agri API
info.app.description=Marketplace backend for farmers and buyers
springdoc.swagger-ui.path=/docs

