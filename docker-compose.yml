services:
  api:
    build: .
    ports:
      - "8085:8085"
    environment:
      PRODUCT_DB_URL: jdbc:mysql://mysql:3306/PRODUCTMANAGEMENT
      USER_DB_URL: jdbc:mysql://mysql:3306/USER
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
